<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConVerg House | Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            height: auto;
            overflow: auto;
            display: block;
        }
        .predictor-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 2rem;
            box-sizing: border-box;
            width: 100%;
        }
        .predictor-container {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            gap: 2rem !important;
            align-items: flex-start !important;
            justify-content: center !important;
            width: 100% !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
            box-sizing: border-box !important;
        }
        .predictor-card {
            background: #fff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            padding: 2rem !important;
            border-radius: 16px !important;
            width: 100% !important;
            max-width: 450px !important;
            box-sizing: border-box !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15) !important;
            transform: none !important;
            flex: 1 1 auto !important;
            margin: 0 !important;
        }
        #calculation-container {
            display: none;
            padding: 3rem !important;
            background: #fff !important;
            border-radius: 16px !important;
            border: none !important;
            width: 100% !important;
            max-width: 600px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15) !important;
            font-family: 'Inter', sans-serif !important;
            flex: 1 1 auto !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        #calculation-container h4 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #1e293b;
        }
        .calc-formula {
            background: #e2e8f0;
            padding: 0.75rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 1rem;
            white-space: pre-wrap;
            text-align: center;
        }
        .calc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .calc-table th, .calc-table td {
            padding: 0.5rem;
            text-align: right;
            border-bottom: 1px solid #cbd5e1;
        }
        .calc-table th:first-child, .calc-table td:first-child {
            text-align: left;
        }
        .calc-table th {
            color: #64748b;
            font-weight: 600;
        }
        .calc-table td {
            color: #334155;
        }
        .calc-total {
            font-weight: 700;
            color: #0f172a;
        }
        .custom-dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #d1d5db;
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .dropdown-item {
            padding: 0.8rem;
            cursor: pointer;
            color: var(--text-primary);
            font-size: 0.95rem;
            border-bottom: 1px solid #f1f5f9;
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .dropdown-item:hover, .dropdown-item.active {
            background-color: #f1f5f9;
        }
        @media (max-width: 768px) {
            .predictor-page {
                justify-content: flex-start;
                padding: 1rem 1rem 2rem 1rem;
                min-height: auto;
            }
            .predictor-container {
                flex-direction: column !important;
                min-width: 0 !important;
                overflow-x: hidden !important;
            }
            .predictor-card {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                gap: 0.8rem !important;
                padding: 1.5rem 1.2rem !important;
                min-width: 0 !important;
            }
            .predictor-card > * {
                grid-column: 1 / -1;
            }
            .predictor-card > h3 { order: 1; margin-bottom: 0 !important; }
            .predictor-card > .form-group { order: 2; } /* Location */
            
            #area-row, #rooms-row {
                display: contents;
            }
            
            #area-row .form-group:nth-child(2) {
                grid-column: 1 / -1;
                order: 3; /* Build Up Area Type */
            }
            
            #area-row .form-group:nth-child(1) {
                grid-column: 1 / 2;
                order: 4; /* Total Square Feet */
            }
            
            #rooms-row .form-group:nth-child(1) {
                grid-column: 2 / 3;
                order: 4; /* BHK */
            }
            
            #rooms-row .form-group:nth-child(2) {
                grid-column: 1 / 2;
                order: 5; /* Bathrooms */
            }
            
            #rooms-row .form-group:nth-child(3) {
                grid-column: 2 / 3;
                order: 5; /* Balconies */
            }
            
            .predictor-card > div[style*="display: flex"] {
                flex-direction: column;
                order: 6;
                margin-top: 0 !important;
                gap: 0.5rem !important;
            }
            .predictor-card > #result {
                order: 7;
                margin-top: 0 !important;
            }
            #calculation-container {
                padding: 1.5rem 1rem !important;
                min-width: 0 !important;
            }
            .calc-table {
                white-space: nowrap;
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <img src="{{ url_for('static', filename='images/logo.png.png') }}" alt="ConVerg House Logo" class="custom-logo">
            <a href="/" style="text-decoration: none; color: inherit;">ConVerg House</a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/how-it-works">How It Works</a>
            <a href="/about">About</a>
        </div>
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </nav>

    <!-- Predictor Area -->
    <div class="predictor-page">
        <div class="predictor-container">
            <div class="predictor-card">
                <h3 style="font-family: 'Inter', sans-serif; font-size: 1.5rem; margin-bottom: 1.5rem; color: var(--text-primary); text-align: center;">Calculate Estimate</h3>
                

                <div class="form-group" style="position: relative;">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="Search Location..." value="" autocomplete="off">
                    <div id="location-dropdown" class="custom-dropdown-list">
                        {% for loc in locations %}
                        <div class="dropdown-item" onmousedown="selectLocation('{{ loc }}')">{{ loc }}</div>
                        {% endfor %}
                    </div>
                </div>
                <div class="form-row" id="area-row">
                    <div class="form-group">
                        <label>Total Square Feet</label>
                        <input type="number" id="sqft" placeholder="e.g. 1200" min="300">
                    </div>
                    <div class="form-group">
                        <label>Build Up Area Type</label>
                        <select id="area_type">
                            {% for area in area_types %}
                            <option value="{{ area }}" {% if 'Super' in area %}selected{% endif %}>{{ area }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-row" id="rooms-row">
                    <div class="form-group">
                        <label>BHK</label>
                        <input type="number" id="bhk" placeholder="e.g. 2" min="1">
                    </div>
                    <div class="form-group">
                        <label>Bathrooms</label>
                        <input type="number" id="bath" placeholder="e.g. 2" min="1">
                    </div>
                    <div class="form-group">
                        <label>Balconies</label>
                        <input type="number" id="balcony" placeholder="e.g. 1" min="0">
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 20px;">
                    <button id="predict-btn" class="btn btn-primary" style="flex: 2; font-size: 1.1rem; padding: 1rem;" onclick="predict()">Calculate Value</button>
                    <button id="clear-btn" class="btn btn-secondary" style="flex: 1; font-size: 1.1rem; padding: 1rem;" onclick="clearInputs()">Clear Input</button>
                </div>
                <div id="result" style="text-align: center; margin-top: 1.5rem; font-size: 1.5rem; font-weight: bold; font-family: 'Inter', sans-serif;"></div>
            </div>
            
            <div id="calculation-container" style="display: none;">
                <h4 style="font-size: 1.2rem; margin-bottom: 1.5rem; text-align: center;">Newton-Raphson Prediction Breakdown</h4>
                <div style="width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;">
                    <table class="calc-table">
                    <thead>
                        <tr>
                            <th>Feature</th>
                            <th>Value (x)</th>
                            <th>Weight (θ)</th>
                            <th>Product</th>
                        </tr>
                    </thead>
                    <tbody id="calc-body">
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" class="calc-total">Predicted Price (Sum)</td>
                            <td class="calc-total" id="calc-total-sum"></td>
                        </tr>
                    </tfoot>
                </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        const locInput = document.getElementById('location');
        const locDropdown = document.getElementById('location-dropdown');
        let currentFocus = -1;
        
        locInput.addEventListener('focus', () => {
            locDropdown.style.display = 'block';
            filterDropdown(); // Show all or filtered on focus
        });
        
        locInput.addEventListener('blur', () => {
            locDropdown.style.display = 'none';
        });
        
        locInput.addEventListener('input', filterDropdown);

        locInput.addEventListener('keydown', function(e) {
            const items = Array.from(locDropdown.getElementsByClassName('dropdown-item')).filter(i => i.style.display !== 'none');
            
            if (e.key === "ArrowDown") {
                currentFocus++;
                addActive(items);
                e.preventDefault();
            } else if (e.key === "ArrowUp") {
                currentFocus--;
                addActive(items);
                e.preventDefault();
            } else if (e.key === "Enter") {
                e.preventDefault();
                if (currentFocus > -1 && items[currentFocus]) {
                    selectLocation(items[currentFocus].innerText);
                }
            }
        });

        function addActive(items) {
            if (!items || items.length === 0) return false;
            removeActive(items);
            if (currentFocus >= items.length) currentFocus = 0;
            if (currentFocus < 0) currentFocus = (items.length - 1);
            items[currentFocus].classList.add("active");
            items[currentFocus].scrollIntoView({ block: "nearest" });
        }

        function removeActive(items) {
            for (let i = 0; i < items.length; i++) {
                items[i].classList.remove("active");
            }
        }

        function filterDropdown() {
            const filter = locInput.value.toLowerCase();
            const items = locDropdown.getElementsByClassName('dropdown-item');
            currentFocus = -1; // Reset selection on filter change
            for (let item of items) {
                if (item.innerText.toLowerCase().includes(filter)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            }
        }

        function selectLocation(val) {
            locInput.value = val;
            locDropdown.style.display = 'none';
            currentFocus = -1;
            locInput.dispatchEvent(new Event('input'));
        }
    </script>
</body>
</html>
