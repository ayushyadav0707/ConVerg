<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converg House | Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .predictor-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            padding: 2rem;
        }
        .predictor-container {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: nowrap !important;
            gap: 2rem !important;
            align-items: flex-start !important;
            justify-content: center !important;
            width: 100% !important;
            max-width: 1200px !important;
            margin: 0 auto !important;
        }
        .predictor-card {
            background: #fff !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            padding: 3rem !important;
            border-radius: 16px !important;
            width: 100% !important;
            max-width: 450px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15) !important;
            transform: none !important;
            flex: 1 1 auto !important;
            margin: 0 !important;
        }
        #calculation-container {
            display: none;
            padding: 3rem !important;
            background: #fff !important;
            border-radius: 16px !important;
            border: none !important;
            width: 100% !important;
            max-width: 600px !important;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15) !important;
            font-family: 'Inter', sans-serif !important;
            flex: 1 1 auto !important;
            margin: 0 !important;
            box-sizing: border-box !important;
        }
        #calculation-container h4 {
            margin-top: 0;
            margin-bottom: 1rem;
            color: #1e293b;
        }
        .calc-formula {
            background: #e2e8f0;
            padding: 0.75rem;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 1rem;
            text-align: center;
        }
        .calc-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .calc-table th, .calc-table td {
            padding: 0.5rem;
            text-align: right;
            border-bottom: 1px solid #cbd5e1;
        }
        .calc-table th:first-child, .calc-table td:first-child {
            text-align: left;
        }
        .calc-table th {
            color: #64748b;
            font-weight: 600;
        }
        .calc-table td {
            color: #334155;
        }
        .calc-total {
            font-weight: 700;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <a href="/" style="text-decoration: none; color: inherit;">Converg House</a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="#">How It Works</a>
            <a href="#">About</a>
        </div>
        <a href="/" class="btn btn-secondary">Back to Home</a>
    </nav>

    <!-- Predictor Area -->
    <div class="predictor-page">
        <div class="predictor-container">
            <div class="predictor-card">
                <h3 style="font-family: 'Inter', sans-serif; font-size: 1.5rem; margin-bottom: 2rem; color: var(--text-primary); text-align: center;">Calculate Estimate</h3>
                <div class="form-group">
                    <label>Location</label>
                    <select id="location">
                        {% for loc in locations %}
                        <option value="{{ loc }}">{{ loc }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>Total Square Feet</label>
                    <input type="number" id="sqft" value="1200" min="300">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>BHK</label>
                        <input type="number" id="bhk" value="2" min="1">
                    </div>
                    <div class="form-group">
                        <label>Bathrooms</label>
                        <input type="number" id="bath" value="2" min="1">
                    </div>
                    <div class="form-group">
                        <label>Balconies</label>
                        <input type="number" id="balcony" value="1" min="0">
                    </div>
                </div>
                <button id="predict-btn" class="btn btn-primary" style="width: 100%; margin-top: 20px; font-size: 1.1rem; padding: 1rem;" onclick="predict()">Calculate Value</button>
                <div id="result" style="text-align: center; margin-top: 1.5rem; font-size: 1.5rem; font-weight: bold; font-family: 'Inter', sans-serif;"></div>
            </div>
            
            <div id="calculation-container">
                <h4 style="font-size: 1.2rem; margin-bottom: 1.5rem; text-align: center;">Newton-Raphson Prediction Calculation</h4>
                <div class="calc-formula" id="calc-formula"></div>
                <table class="calc-table">
                    <thead>
                        <tr>
                            <th>Feature</th>
                            <th>Value (x)</th>
                            <th>Weight (θ)</th>
                            <th>Product</th>
                        </tr>
                    </thead>
                    <tbody id="calc-body">
                    </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" class="calc-total">Predicted Price (Sum)</td>
                            <td class="calc-total" id="calc-total-sum"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
